name: Build 360T7 Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone source
        run: |
          git clone --depth 1 --single-branch \
            -b mt798x-mt799x-6.6-mtwifi \
            https://github.com/padavanonly/immortalwrt-mt798x-6.6 openwrt
          cd openwrt
          git log -1 --format='commit=%h  date=%ad  subject=%s'

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_luci-app-wireguard=y
          CONFIG_PACKAGE_luci-i18n-wireguard-zh-cn=y
          CONFIG_PACKAGE_kmod-wireguard=y
          EOF
          make defconfig
          echo "=== selected device ==="
          grep -E 'DEVICE_qihoo_360t7' .config
          echo "=== wireguard packages ==="
          grep -E '^CONFIG_PACKAGE_(kmod-wireguard|wireguard-tools|luci-proto-wireguard|luci-app-wireguard|luci-i18n-wireguard-zh-cn)=' .config || true
          if ! grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7=y' .config; then
            echo "::error::device profile qihoo_360t7 not found - aborting before build"
            exit 1
          fi

      - name: Download sources
        run: |
          cd openwrt
          make -j$(nproc) download

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Collect artifacts
        if: always()
        run: |
          cd openwrt
          echo "=== images ==="
          ls -lh bin/targets/mediatek/filogic/ 2>/dev/null || true
          echo "=== kmods ==="
          ls -lh bin/targets/mediatek/filogic/packages/ 2>/dev/null | head -20 || true

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 360t7-firmware
          if-no-files-found: error
          retention-days: 30
          path: |
            openwrt/bin/targets/mediatek/filogic/*.itb
            openwrt/bin/targets/mediatek/filogic/*.fip
            openwrt/bin/targets/mediatek/filogic/*.bin
            openwrt/bin/targets/mediatek/filogic/sha256sums
            openwrt/bin/targets/mediatek/filogic/packages/*wireguard*.ipk
            openwrt/bin/targets/mediatek/filogic/packages/kmod-udptunnel*.ipk
            openwrt/bin/targets/mediatek/filogic/packages/kmod-crypto-lib-*.ipk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          if-no-files-found: ignore
          retention-days: 7
          path: |
            openwrt/logs/
            openwrt/.config
