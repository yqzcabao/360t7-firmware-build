name: Build 360T7 Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # 目标包清单，构建后逐项核对，缺失的会在日志里标 warning
  EXPECTED: >-
    kmod-wireguard wireguard-tools luci-proto-wireguard luci-app-wireguard
    appfilter luci-app-appfilter luci-app-banip luci-app-adblock
    luci-app-https-dns-proxy luci-app-wifischedule luci-app-arpbind
    luci-app-nft-qos luci-app-sqm luci-app-nlbwmon
    luci-app-openclash luci-app-ttyd luci-app-attendedsysupgrade
    luci-app-package-manager luci-app-ddns luci-app-vlmcsd

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone source
        run: |
          git clone --depth 1 --single-branch \
            -b mt798x-mt799x-6.6-mtwifi \
            https://github.com/padavanonly/immortalwrt-mt798x-6.6 openwrt
          cd openwrt
          git log -1 --format='commit=%h  date=%ad  subject=%s'

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config
        run: |
          cd openwrt
          cat > .config <<'EOF'
          # --- 目标平台与设备 ---
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7=y

          # --- WireGuard ---
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_luci-app-wireguard=y

          # --- 上网管理 / 家长控制 ---
          CONFIG_PACKAGE_appfilter=y
          CONFIG_PACKAGE_luci-app-appfilter=y
          CONFIG_PACKAGE_luci-app-banip=y
          CONFIG_PACKAGE_luci-app-adblock=y
          CONFIG_PACKAGE_luci-app-https-dns-proxy=y
          CONFIG_PACKAGE_luci-app-wifischedule=y
          CONFIG_PACKAGE_luci-app-arpbind=y
          CONFIG_PACKAGE_luci-app-nft-qos=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y

          # --- 代理 ---
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_kmod-tun=y

          # --- DNS ---
          CONFIG_PACKAGE_dnsmasq=n
          CONFIG_PACKAGE_dnsmasq-full=y

          # --- 系统工具 ---
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_socat=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_zram-swap=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-attendedsysupgrade=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y
          CONFIG_PACKAGE_vlmcsd=y

          # --- 中文 ---
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-wireguard-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-openclash-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-appfilter-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-adblock-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-banip-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-nft-qos-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-sqm-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-nlbwmon-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-wifischedule-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-https-dns-proxy-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-attendedsysupgrade-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-vlmcsd-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-arpbind-zh-cn=y
          EOF
          make defconfig

          echo "=== 设备 ==="
          grep -E 'DEVICE_qihoo_360t7' .config
          if ! grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7=y' .config; then
            echo "::error::device profile qihoo_360t7 not selected - aborting"
            exit 1
          fi

          echo "=== 包清单核对 ==="
          MISSING=""
          for p in $EXPECTED; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "  OK      $p"
            else
              echo "::warning::missing $p"
              MISSING="$MISSING $p"
            fi
          done
          echo "missing:${MISSING:- none}"

      - name: Download sources
        run: |
          cd openwrt
          make -j$(nproc) download

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      - name: Collect artifacts
        if: always()
        run: |
          cd openwrt
          echo "=== images ==="
          ls -lh bin/targets/mediatek/filogic/ 2>/dev/null || true
          df -h /

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 360t7-firmware
          if-no-files-found: error
          retention-days: 30
          path: |
            openwrt/bin/targets/mediatek/filogic/*.itb
            openwrt/bin/targets/mediatek/filogic/*.fip
            openwrt/bin/targets/mediatek/filogic/*.bin
            openwrt/bin/targets/mediatek/filogic/sha256sums
            openwrt/bin/targets/mediatek/filogic/packages/

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          if-no-files-found: ignore
          retention-days: 7
          path: |
            openwrt/logs/
            openwrt/.config
