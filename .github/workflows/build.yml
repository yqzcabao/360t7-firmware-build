name: Build 360T7 Firmware

# 官方 ImmortalWrt 25.12 源码 + ubootmod（刷不死 U-Boot）布局
# 产物从刷不死 U-Boot 的恢复网页（192.168.1.1）刷入，不碰 BL2/FIP。

on:
  workflow_dispatch:
    inputs:
      version:
        description: ImmortalWrt 版本（官方 tag，不带 v）
        default: "25.12.2"
        required: true
      match_official_kmods:
        description: 用官方构建种子配置，使内核 vermagic 与官方一致（之后可直接 apk add 官方 kmod；构建更久）
        type: boolean
        default: true
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || '25.12.2' }}
  # push 触发时 inputs 为空，默认 true
  MATCH_KMODS: ${{ github.event_name == 'workflow_dispatch' && !inputs.match_official_kmods && 'false' || 'true' }}
  DEVICE: qihoo_360t7-ubootmod
  # ccache 上限（未压缩；actions/cache 存的时候会再压缩）。仓库缓存总额 10GB，旧的自动淘汰
  CCACHE_MAXSIZE: 6G
  # 构建后逐项核对，缺失的会在日志里标 warning
  EXPECTED: >-
    kmod-wireguard wireguard-tools luci-proto-wireguard
    appfilter luci-app-appfilter luci-app-banip luci-app-adblock
    luci-app-https-dns-proxy luci-app-wifischedule luci-app-arpbind
    luci-app-eqos luci-app-sqm luci-app-nlbwmon
    kmod-tun kmod-nft-tproxy kmod-inet-diag dnsmasq-full luci-app-ttyd
    luci-app-package-manager luci-app-ddns luci-app-vlmcsd
    luci-theme-argon luci-app-argon-config

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache \
                      /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools python3-pyelftools \
            libelf-dev rsync swig unzip zlib1g-dev file wget zstd

      - name: Clone official source
        run: |
          git clone --depth 1 --branch "v$VERSION" \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          git log -1 --format='commit=%h  date=%ad  subject=%s'

      - name: Apply ubootmod overlay
        run: |
          cd openwrt
          cp ../ubootmod/mt7981b-qihoo-360t7-ubootmod.dts target/linux/mediatek/dts/
          MK=target/linux/mediatek/image/filogic.mk
          grep -q 'define Device/qihoo_360t7-ubootmod' "$MK" || cat ../ubootmod/qihoo_360t7-ubootmod.mk >> "$MK"

          # 网口：官方脚本里没有 ubootmod 板名，默认会多出一个不存在的 lan4
          NET=target/linux/mediatek/filogic/base-files/etc/board.d/02_network
          if ! grep -q 'qihoo,360t7-ubootmod' "$NET"; then
            # 在 "qihoo,360t7-ubi|\" 那行后面插入同样格式的 ubootmod 行（lan1 lan2 lan3 + wan）
            awk '{print} !d && index($0, "qihoo,360t7-ubi|") {sub(/360t7-ubi/, "360t7-ubootmod"); print; d=1}' \
              "$NET" > "$NET.new" && mv "$NET.new" "$NET"
          fi
          echo "=== 02_network ==="
          grep -n -B2 -A6 'qihoo,360t7-ubootmod' "$NET"
          if [ "$(grep -c 'qihoo,360t7-ubootmod' "$NET")" != 1 ]; then
            echo "::error::02_network patch did not apply exactly once"
            exit 1
          fi

          # 首次启动脚本（清理 video 源兜底、默认主题 argon）
          cp -r ../files ./files
          chmod +x files/etc/uci-defaults/*

      # 缓存：dl/ 源码包 + ccache 编译缓存。每次运行存一份新的（失败/超时也存），
      # 下次从最近一份恢复，已经编过的文件直接命中缓存。
      - name: Restore download cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          key: dl-${{ env.VERSION }}-${{ github.run_id }}
          restore-keys: dl-${{ env.VERSION }}-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ env.VERSION }}-kmods${{ env.MATCH_KMODS }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.VERSION }}-kmods${{ env.MATCH_KMODS }}-

      - name: Update feeds
        run: |
          cd openwrt
          # 官方 25.12 不发布 video 源（.../aarch64_cortex-a53/video 是 404），
          # 留着它 /etc/apk/repositories 里就会多一行坏源，apk update 报错
          sed -i '/^src-[a-z]*[[:space:]]\+video[[:space:]]/d' feeds.conf.default
          echo "=== feeds.conf.default ==="
          cat feeds.conf.default
          if grep -qE '^src-[a-z]+[[:space:]]+video[[:space:]]' feeds.conf.default; then
            echo "::error::video feed still present"
            exit 1
          fi
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config
        run: |
          cd openwrt
          : > .config
          if [ "$MATCH_KMODS" = true ]; then
            # 官方 buildbot 的种子配置：保留内核选项、ALL_KMODS、软件源地址，
            # 去掉多设备、SDK/ImageBuilder、LLVM BPF 等只在官方构建机上需要的东西
            curl -sfL "https://downloads.immortalwrt.org/releases/$VERSION/targets/mediatek/filogic/config.buildinfo" \
              | grep -vE 'DEVICE_|TARGET_MULTI_PROFILE|TARGET_ALL_PROFILES|ALL_NONSHARED|CONFIG_SDK|CONFIG_IB=|MAKE_TOOLCHAIN|COLLECT_KERNEL_DEBUG|JSON_CYCLONEDX_SBOM|CONFIG_BUILDBOT|^CONFIG_PACKAGE_.*=m$' \
              > .config
            if ! grep -q '^CONFIG_ALL_KMODS=y' .config; then
              echo "::error::failed to fetch official config.buildinfo for $VERSION"
              exit 1
            fi
          fi
          cat >> .config <<'EOF'
          # --- 编译缓存 ---
          CONFIG_DEVEL=y
          CONFIG_CCACHE=y

          # --- 目标平台与设备 ---
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_qihoo_360t7-ubootmod=y

          # --- WireGuard ---
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y

          # --- 上网管理 / 家长控制 ---
          CONFIG_PACKAGE_appfilter=y
          CONFIG_PACKAGE_luci-app-appfilter=y
          CONFIG_PACKAGE_luci-app-banip=y
          CONFIG_PACKAGE_luci-app-adblock=y
          CONFIG_PACKAGE_luci-app-https-dns-proxy=y
          CONFIG_PACKAGE_luci-app-wifischedule=y
          CONFIG_PACKAGE_luci-app-arpbind=y
          CONFIG_PACKAGE_luci-app-eqos=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y

          # --- 代理 ---
          # OpenClash 本体刷机后用 `apk add luci-app-openclash` 装；这里只预装它要的
          # 内核模块，保证 vermagic 对不上时也能装（ruby 等用户态依赖从官方源拉）。
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          # 万一有包把 ruby 带进来：ruby 的 YJIT 要编 rust/host，而 rust 要从
          # ci-artifacts.rust-lang.org 下载的 LLVM 已被删除（404）。
          # CONFIG_RUBY_ENABLE_YJIT is not set

          # --- DNS ---
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_dnsmasq-full=y

          # --- 系统工具 ---
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_socat=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_zram-swap=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y
          CONFIG_PACKAGE_vlmcsd=y

          # 在线升级服务器不认识 ubootmod 这个自编 profile，用不了
          # CONFIG_PACKAGE_luci-app-attendedsysupgrade is not set
          # CONFIG_PACKAGE_luci-i18n-attendedsysupgrade-zh-cn is not set
          # CONFIG_PACKAGE_owut is not set

          # --- 主题 ---
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y

          # --- 中文 ---
          CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-appfilter-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-adblock-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-banip-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-eqos-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-sqm-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-nlbwmon-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-wifischedule-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-https-dns-proxy-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-vlmcsd-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-arpbind-zh-cn=y
          EOF
          make defconfig

          echo "=== 设备 ==="
          grep -E 'DEVICE_qihoo_360t7' .config
          if ! grep -q "^CONFIG_TARGET_mediatek_filogic_DEVICE_${DEVICE}=y" .config; then
            echo "::error::device profile $DEVICE not selected - aborting"
            exit 1
          fi

          if grep -q '^CONFIG_RUBY_ENABLE_YJIT=y' .config; then
            echo "::error::RUBY_ENABLE_YJIT still enabled - rust/host would be built and fail"
            exit 1
          fi

          echo "=== 包清单核对 ==="
          MISSING=""
          for p in $EXPECTED; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "  OK      $p"
            else
              echo "::warning::missing $p"
              MISSING="$MISSING $p"
            fi
          done
          echo "missing:${MISSING:- none}"

      - name: Download sources
        run: |
          cd openwrt
          make -j$(nproc) download

      - name: Save download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: dl-${{ env.VERSION }}-${{ github.run_id }}

      - name: Build firmware
        # 比整个任务的 355 分钟早结束，留时间保存 ccache
        timeout-minutes: 315
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: ccache stats
        if: always()
        run: |
          cd openwrt
          [ -d .ccache ] || exit 0
          # OpenWrt 把缓存放在 openwrt/.ccache，不指定的话 ccache -s 读的是空的 ~/.ccache
          CCACHE_DIR="$PWD/.ccache" staging_dir/host/bin/ccache -s 2>/dev/null || true
          du -sh .ccache

      - name: Save ccache
        # 失败、超时也保存，下次接着用
        if: always()
        uses: actions/cache/save@v4
        with:
          path: openwrt/.ccache
          key: ccache-${{ env.VERSION }}-kmods${{ env.MATCH_KMODS }}-${{ github.run_id }}

      - name: Check images and vermagic
        if: always()
        run: |
          cd openwrt
          OUT=bin/targets/mediatek/filogic
          echo "=== images ==="
          ls -lh $OUT/*ubootmod* 2>/dev/null || true
          df -h /

          echo "=== apk 软件源 ==="
          REPOS=$(find build_dir/target-*/root-* -path '*/etc/apk/repositories*' -type f 2>/dev/null || true)
          if [ -n "$REPOS" ]; then
            cat $REPOS
            if grep -q '/video' $REPOS; then
              echo "::warning::video repo still in rootfs (first-boot script will remove it)"
            fi
          else
            echo "(rootfs 已清理，跳过)"
          fi

          MINE=$(cat build_dir/target-*/linux-mediatek_filogic/linux-[0-9]*/.vermagic 2>/dev/null | head -1 || true)
          if [ -z "$MINE" ]; then
            # 构建目录被 AUTOREMOVE 清掉时，从 kernel 包的文件名里取
            MINE=$(ls $OUT/packages/ 2>/dev/null | grep -E '^kernel[-_]' | grep -oE '[0-9a-f]{32}' | head -1 || true)
          fi
          OFFICIAL=$(curl -sfL "https://downloads.immortalwrt.org/releases/$VERSION/targets/mediatek/filogic/kmods/" \
            | grep -oE 'href="[0-9][^"/]*-[0-9a-f]{32}/"' | head -1 | grep -oE '[0-9a-f]{32}' || true)
          echo "vermagic: mine=${MINE:-?} official=${OFFICIAL:-?}"
          if [ -n "$MINE" ] && [ "$MINE" = "$OFFICIAL" ]; then
            echo "vermagic 与官方一致：可以直接 apk add 官方源里的 kmod"
          else
            echo "::warning::vermagic 与官方不一致，官方源里的 kmod 装不上，需要的内核模块请编进固件"
          fi

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 360t7-ubootmod-${{ env.VERSION }}
          if-no-files-found: error
          retention-days: 30
          path: |
            openwrt/bin/targets/mediatek/filogic/*ubootmod*
            openwrt/bin/targets/mediatek/filogic/sha256sums
            openwrt/bin/targets/mediatek/filogic/*.manifest

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            openwrt/logs/
            openwrt/.config
